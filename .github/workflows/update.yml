name: Update Horizon launcher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    name: Update Horizon launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for a new release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/update.sh --ci --only-check

      - name: Install Nix
        if: steps.check.outputs.should_update == 'true'
        uses: cachix/install-nix-action@v31

      - name: Update source.json
        id: update
        if: steps.check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/update.sh --ci

      - name: Build
        if: steps.check.outputs.should_update == 'true'
        run: nix build --print-build-logs .#horizon-launcher

      - name: Commit
        if: steps.check.outputs.should_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.update.outputs.commit_message }}
          file_pattern: source.json
